<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura — Sign In</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Distinctive font pairing: Syne (display) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ░░ Background Image ░░ -->
  <div class="bg-canvas" aria-hidden="true">
    <!-- Replace the src below with your own image path, e.g. "bg.jpg" -->
    <img
      class="bg-image"
      src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1920&q=80"
      alt=""
      fetchpriority="high"
    />
    <!-- Dark gradient overlay so the card stays readable -->
    <div class="bg-overlay"></div>
  </div>

  <!-- ░░ Login Card ░░ -->
  <main class="stage">
    <article class="glass-card">

      <!-- Light reflection sheen -->
      <div class="card-sheen" aria-hidden="true"></div>

      <!-- Logo / Brand -->
      <header class="card-header">
        <div class="logo-mark" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 3L33 30H3L18 3Z" fill="url(#logoGrad)" />
            <path d="M18 12L27 27H9L18 12Z" fill="rgba(0,0,0,0.35)" />
            <defs>
              <linearGradient id="logoGrad" x1="3" y1="30" x2="33" y2="3" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#7c3aed"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="brand-name">Aura</h1>
        <p class="brand-tagline">Welcome back</p>
      </header>

      <!-- Form -->
      <form class="login-form" novalidate>

        <!-- Email Field -->
        <div class="field-group">
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <!-- email icon -->
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="M2 7l10 7 10-7"/>
              </svg>
            </span>
            <input
              class="glass-input"
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder=" "
              required
            />
            <label class="float-label" for="email">Email address</label>
          </div>
        </div>

        <!-- Password Field -->
        <div class="field-group">
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <!-- lock icon -->
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              class="glass-input"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder=" "
              required
            />
            <label class="float-label" for="password">Password</label>
            <!-- Show / hide toggle -->
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
              <svg class="eye-icon eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-icon eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember me + Forgot password -->
        <div class="form-meta">
          <label class="remember-label">
            <input type="checkbox" class="custom-check" name="remember" />
            <span class="check-box" aria-hidden="true"></span>
            <span class="check-text">Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-login">
          <span class="btn-text">Sign in</span>
          <span class="btn-arrow" aria-hidden="true">→</span>
          <span class="btn-shimmer" aria-hidden="true"></span>
        </button>

      </form>

      <!-- Sign up -->
      <footer class="card-footer">
        <p class="signup-prompt">
          Don't have an account?
          <a href="#" class="signup-link">Create one free</a>
        </p>
      </footer>

    </article>
  </main>

  <script>
    /* ── Password visibility toggle ── */
    const togglePw  = document.getElementById('togglePw');
    const pwField   = document.getElementById('password');
    const eyeOpen   = document.querySelector('.eye-open');
    const eyeClosed = document.querySelector('.eye-closed');

    togglePw.addEventListener('click', () => {
      const isHidden = pwField.type === 'password';
      pwField.type        = isHidden ? 'text'     : 'password';
      eyeOpen.style.display   = isHidden ? 'none'     : '';
      eyeClosed.style.display = isHidden ? ''         : 'none';
    });
  </script>
</body>
</html>
